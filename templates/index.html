<html lang="en"><head><meta charset="utf-8">

<body>
<header><h1>Pathfinder</h1><p>Find the right career resource, then take it one small step at a time.</p>

<main>
 <section class="view">

  <div class="row"><button class="btn" form="quiz" type="submit">See my match</button>

 </section>
 <section class="view" id="results" hidden></section>
 <section class="view" id="quest" hidden></section>
</main>
<footer>Prototype for a class capstone. Event details are sample data. <a href="#" id="reset">Start over</a></footer>
